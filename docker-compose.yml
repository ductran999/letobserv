services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.11.0
    container_name: clickstack
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8080:8080"   # UI Hyperdx
    restart: unless-stopped

  postgres:
    image: postgres:17.5-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    networks:
      - localnet
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 60s
    restart: unless-stopped

  migrate_inventory_db:
    image: migrate/migrate
    container_name: migrate_inventory_db
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/wait-and-migrate.sh]
    restart: "no"
    volumes:
      - ./scripts/migrate_inventory_db.sh:/wait-and-migrate.sh
      - ./services/inventory/migrations/schemas:/migrations
    networks:
      - localnet
  
  migrate_order_db:
    image: migrate/migrate
    container_name: migrate_order_db
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/wait-and-migrate.sh]
    restart: "no"
    volumes:
      - ./scripts/migrate_placement_db.sh:/wait-and-migrate.sh
      - ./services/placement/migrations/schemas:/migrations
    networks:
      - localnet

volumes:
  pg-data:
    driver: local

networks:
  localnet:
    driver: bridge
