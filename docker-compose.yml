services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.11.0
    container_name: clickstack
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17.5-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    networks:
      - localnet
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  migrate_inventory_db:
    image: migrate/migrate
    container_name: migrate_inventory_db
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/wait-and-migrate.sh]
    restart: "no"
    volumes:
      - ./scripts/migrate_inventory_db.sh:/wait-and-migrate.sh
      - ./services/inventory/migrations/schemas:/migrations
    networks:
      - localnet

  migrate_order_db:
    image: migrate/migrate
    container_name: migrate_order_db
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/wait-and-migrate.sh]
    restart: "no"
    volumes:
      - ./scripts/migrate_placement_db.sh:/wait-and-migrate.sh
      - ./services/placement/migrations/schemas:/migrations
    networks:
      - localnet

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar 
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - localnet

  db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    ports:
      - "11011:5432"
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - localnet

volumes:
  pg-data:
  postgresql:
  postgresql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  localnet: