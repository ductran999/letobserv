all: false
filename: mock_test.go
force-file-write: true
formatter: goimports
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: 'mocks'
recursive: true
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'

packages:
  github.com/ductran999/letobserv/services/placement/internal/modules/order/domain:
    config:
      all: true
      dir: "services/placement/mocks/order"
  github.com/ductran999/letobserv/services/inventory/internal/modules/inventory/domain:
    config:
      all: true
      dir: "services/inventory/mocks/inventory"
  github.com/ductran999/letobserv/services/inventory/internal/modules/product/domain:
    config:
      all: true
      dir: "services/inventory/mocks/product"
