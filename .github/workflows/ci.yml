name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GolangCI-Lint (inventory)
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          working-directory: services/inventory
          args: --timeout 5m --config ../../.golangci.yml

      - name: Run GolangCI-Lint (placement)
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          working-directory: services/placement
          args: --timeout 5m --config ../../.golangci.yml

      - name: Run GolangCI-Lint (pkg)
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          working-directory: pkg
          args: --timeout 5m --config ../.golangci.yml